# =============================================================================
# Ink & Memory — Host-level Nginx Reverse Proxy
# =============================================================================
# This config runs on the host machine (NOT inside Docker) and routes incoming
# requests to the appropriate Docker container based on the domain name.
#
# Architecture:
#   ink-frontend.suoxya.com → 127.0.0.1:8080  (Docker frontend nginx container)
#   ink-backend.suoxya.com  → 127.0.0.1:8765  (Docker backend FastAPI container)
#   SEO files on the frontend domain → 127.0.0.1:8765 (backend generators)
#
# The frontend container's internal nginx serves the SPA at / and proxies
# /api/* plus /polycli/* to the backend as same-origin fallback.
#
# Installation:
#   sudo cp this file → /etc/nginx/sites-available/ink-and-memory
#   sudo ln -s /etc/nginx/sites-available/ink-and-memory /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# [Sync] 2026-06-12: setup-nginx.sh renders these default upstream host ports
# from REMOTE_BACKEND_PORT / REMOTE_FRONTEND_PORT before deployment.
# [Sync] 2026-06-15: route frontend-domain robots/sitemap/llms files directly
# to the backend generators to avoid Docker-internal proxy fallback failures.
# [Sync] 2026-06-15: remove /ink-and-memory frontend path prefix.
# =============================================================================

# ── Connection Upgrade Map (WebSocket) ─────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Upstream Definitions ───────────────────────────────────────────────────
upstream ink_backend {
    server 127.0.0.1:8765;
    keepalive 32;
}

upstream ink_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# =============================================================================
# ink-backend.suoxya.com — Backend API (FastAPI / uvicorn)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ink-backend.suoxya.com;

    # ── Access & error logs ─────────────────────────────────────────────
    access_log /var/log/nginx/ink-backend-access.log;
    error_log  /var/log/nginx/ink-backend-error.log warn;

    # ── Client body size ────────────────────────────────────────────────
    client_max_body_size 100m;

    # ── Health check (no auth, no buffering needed) ─────────────────────
    location /api/health {
        proxy_pass http://ink_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── PolyCLI WebSocket ───────────────────────────────────────────────
    location /polycli/ {
        proxy_pass http://ink_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── General API ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://ink_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE / long-polling support
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# =============================================================================
# ink-frontend.suoxya.com — Frontend SPA
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ink-frontend.suoxya.com;

    # ── Access & error logs ─────────────────────────────────────────────
    access_log /var/log/nginx/ink-frontend-access.log;
    error_log  /var/log/nginx/ink-frontend-error.log warn;

    # ── Client body size ────────────────────────────────────────────────
    client_max_body_size 50m;

    # ── Public SEO / AI-search files ────────────────────────────────────
    # These URLs are expected on the frontend public origin, but the content is
    # generated by FastAPI from INK_PUBLIC_BASE_URL / INK_BACKEND_PUBLIC_BASE_URL.
    location = /robots.txt {
        proxy_pass http://ink_backend/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /sitemap.xml {
        proxy_pass http://ink_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /llms.txt {
        proxy_pass http://ink_backend/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ── Pass everything to the frontend container ───────────────────────
    # The frontend container's internal nginx handles:
    #   / → static SPA
    #   /api/ → proxy to backend
    #   /polycli/ → WebSocket proxy to backend
    location / {
        proxy_pass http://ink_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket upgrade for PolyCLI (passes through frontend container)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE / long-polling for API calls proxied through frontend
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

