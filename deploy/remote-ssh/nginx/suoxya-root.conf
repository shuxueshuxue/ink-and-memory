# =============================================================================
# Ink & Memory — Apex Domain (suoxya.com) Reverse Proxy
# =============================================================================
# Serves the apex domain suoxya.com with the SAME content as
# ink-memory.suoxya.com, by forwarding requests to that subdomain as an
# external service — NOT by redirecting or by hardcoding the backend IP.
#
# Architecture:
#   suoxya.com/            → http://ink-memory.suoxya.com  (frontend service)
#   suoxya.com SEO files   → ink_backend upstream (127.0.0.1:8765)
#
# Depends on the `map $http_upgrade` and `upstream ink_backend` blocks defined
# in ink-and-memory.conf.  Those are the ONLY shared definitions this file
# relies on; the frontend proxy goes directly to the ink-memory subdomain.
#
# Installation (on the remote server):
#   sudo cp suoxya-root.conf /etc/nginx/sites-available/suoxya-root
#   sudo ln -s /etc/nginx/sites-available/suoxya-root /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: Ensure ink-and-memory.conf is also enabled (it provides the map and
#       ink_backend upstream definitions this file relies on).
# =============================================================================
# =============================================================================
# suoxya.com — Apex domain serving the frontend SPA
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name suoxya.com www.suoxya.com;

    # ── Access & error logs ─────────────────────────────────────────────
    access_log /var/log/nginx/suoxya-root-access.log;
    error_log  /var/log/nginx/suoxya-root-error.log warn;

    # ── Client body size ────────────────────────────────────────────────
    client_max_body_size 50m;

    # ── Public SEO / AI-search files ────────────────────────────────────
    # Served on the apex origin, but generated by FastAPI from
    # INK_PUBLIC_BASE_URL / INK_BACKEND_PUBLIC_BASE_URL.
    location = /robots.txt {
        proxy_pass http://ink_backend/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /sitemap.xml {
        proxy_pass http://ink_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /llms.txt {
        proxy_pass http://ink_backend/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ── Pass everything to ink-memory.suoxya.com ──────────────────────
    # Forward to the frontend service behind ink-memory.suoxya.com.
    # Host is explicitly set to the subdomain so the upstream nginx routes
    # to the correct server block (avoids looping back to this block).
    location / {
        proxy_pass http://ink-memory.suoxya.com;
        proxy_http_version 1.1;
        proxy_set_header Host ink-memory.suoxya.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket upgrade for PolyCLI (passes through frontend container)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE / long-polling for API calls proxied through frontend
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

